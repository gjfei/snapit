[package]
name = "snapit"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[[bin]]
name = "snapit"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
env_logger.workspace = true
futures.workspace = true
gpui-kit.workspace = true
image.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
snapit-capture.workspace = true
snapit-ocr.workspace = true
snapit-recorder.workspace = true
snapit-store.workspace = true
chrono.workspace = true
rust-i18n.workspace = true
sys-locale.workspace = true
tiny-skia = "0.11"
fontdue = "0.9"
global-hotkey = "0.9"
tray-icon = { version = "0.26", default-features = false }
auto-launch = "0.6"

# Embeds `assets/snapit.ico` as resource 1, which gpui-pre-windows loads as the
# window/taskbar icon (and Explorer shows on the exe). No-op off Windows.
[build-dependencies]
embed-resource = "3"

# Waits for the running app to exit and starts the NSIS installer elevated.
[target.'cfg(target_os = "windows")'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# 替换 GPUIPanel 的 constrainFrameRect:toScreen:，让全屏浮层从创建起就不被 AppKit
# 压到菜单栏下；raw-window-handle 用来取 NSWindow 同步置前。版本都与 gpui-pre-macos
# 对齐，不引入新依赖版本。
[target.'cfg(target_os = "macos")'.dependencies]
raw-window-handle = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3.2", features = ["NSGeometry"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGWindow"] }
