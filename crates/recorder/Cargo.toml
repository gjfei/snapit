[package]
name = "snapit-recorder"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
gif = "0.13"
image.workspace = true
log.workspace = true
snapit-capture.workspace = true

# MP4 goes through whatever encoder the OS ships, so no codec is compiled in.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSDictionary",
    "NSError",
    "NSObject",
    "NSString",
    "NSURL",
    "NSValue",
] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "CFDictionary",
] }
objc2-core-media = { version = "0.3.2", default-features = false, features = [
    "std",
    "CMTime",
] }
objc2-core-video = { version = "0.3.2", default-features = false, features = [
    "std",
    "CVBuffer",
    "CVImageBuffer",
    "CVPixelBuffer",
    "CVReturn",
] }
objc2-av-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "AVAssetWriter",
    "AVAssetWriterInput",
    "AVMediaFormat",
    "AVVideoSettings",
    "objc2-core-media",
    "objc2-core-video",
] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Foundation",
    "Win32_Foundation",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
] }
