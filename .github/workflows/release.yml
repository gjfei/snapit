name: Release

# Push a tag matching [workspace.package] version, e.g. `git tag v0.1.0 && git push origin v0.1.0`.
# workflow_dispatch rebuilds an existing tag. Shape follows SwitchHostsLite: prepare → 4-target
# matrix → latest.json + GitHub Release. macOS zip/DMG: ditto + hdiutil ULMO with an
# /Applications symlink. Windows: NSIS all-users setup.exe (scripts/windows/snapit.nsi).
# Developer ID / notarytool / stapler run when those secrets are set; otherwise ad-hoc, do not fail.
# Do not float the rust-toolchain.toml pin (1.99.1).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish, e.g. v0.1.0"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  quality:
    name: Tests, clippy and release scripts (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          submodules: recursive

      - name: Toolchain
        shell: bash
        run: |
          rustup toolchain install
          rustup component add clippy
          rustc --version

      - uses: Swatinem/rust-cache@v2

      - name: Tests
        run: cargo test --locked --workspace

      - name: Test xcap
        run: cargo test --manifest-path vendor/xcap/Cargo.toml --lib

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Release script syntax and version failure tests
        if: runner.os == 'macOS'
        run: |
          for script in scripts/bundle-macos.sh scripts/package-macos.sh scripts/bundle-windows.sh; do
            bash -n "$script"
          done
          fake_dir="$(mktemp -d)"
          trap 'rm -rf "$fake_dir"' EXIT
          PYTHONPYCACHEPREFIX="$fake_dir/pycache" python3 -m py_compile scripts/release-manifest.py scripts/test-release-rollback.py
          python3 scripts/test-release-rollback.py
          cat > "$fake_dir/cargo" <<'EOF'
          #!/usr/bin/env bash
          printf '%s\n' '{"packages":[{"name":"snapit","version":"9.8.7-beta.1"}]}'
          EOF
          chmod +x "$fake_dir/cargo"
          for script in scripts/bundle-macos.sh scripts/package-macos.sh scripts/bundle-windows.sh; do
            version="$(PATH="$fake_dir:$PATH" "$script" --version)"
            [[ "$version" == "9.8.7-beta.1" ]] || { echo "bad version from $script: $version" >&2; exit 1; }
          done
          cat > "$fake_dir/cargo" <<'EOF'
          #!/usr/bin/env bash
          exit 42
          EOF
          chmod +x "$fake_dir/cargo"
          for script in scripts/bundle-macos.sh scripts/package-macos.sh scripts/bundle-windows.sh; do
            if PATH="$fake_dir:$PATH" "$script" --version >/dev/null 2>&1; then
              echo "$script silently accepted failed cargo metadata" >&2
              exit 1
            fi
          done
          cat > "$fake_dir/cargo" <<'EOF'
          #!/usr/bin/env bash
          printf '%s\n' '{"packages":[]}'
          EOF
          chmod +x "$fake_dir/cargo"
          for script in scripts/bundle-macos.sh scripts/package-macos.sh scripts/bundle-windows.sh; do
            if PATH="$fake_dir:$PATH" "$script" --version >/dev/null 2>&1; then
              echo "$script silently accepted a missing package version" >&2
              exit 1
            fi
          done

          mkdir "$fake_dir/assets"
          for asset in \
            SnapIt-9.8.7-beta.1-macos-aarch64.zip \
            SnapIt-9.8.7-beta.1-macos-aarch64.dmg \
            SnapIt-9.8.7-beta.1-macos-x86_64.zip \
            SnapIt-9.8.7-beta.1-macos-x86_64.dmg \
            SnapIt-9.8.7-beta.1-windows-x86_64-setup.exe \
            SnapIt-9.8.7-beta.1-windows-aarch64-setup.exe; do
            printf 'release asset\n' > "$fake_dir/assets/$asset"
          done
          python3 scripts/release-manifest.py --dir "$fake_dir/assets" \
            --version 9.8.7-beta.1 --repo owner/repo >/dev/null
          python3 - "$fake_dir/assets/latest.json" <<'PY'
          import json, sys
          expected = {
              "macos-aarch64", "macos-aarch64-dmg",
              "macos-x86_64", "macos-x86_64-dmg",
              "windows-x86_64", "windows-aarch64",
          }
          assets = json.load(open(sys.argv[1], encoding="utf-8"))["assets"]
          if set(assets) != expected:
              raise SystemExit(f"bad release asset keys: {sorted(assets)}")
          PY

  prepare:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          submodules: recursive

      - name: Tag matches Cargo.toml
        id: version
        run: |
          version="$(cargo metadata --format-version 1 --no-deps | python3 -c '
          import json, sys
          metadata = json.load(sys.stdin)
          packages = [p for p in metadata["packages"] if p["name"] == "snapit"]
          if len(packages) != 1:
              raise SystemExit("cargo metadata did not return exactly one snapit package")
          print(packages[0]["version"])
          ')"
          if [[ -z "$version" || "$TAG" != "v$version" ]]; then
            echo "::error::Tag $TAG does not match the Cargo.toml version $version (expected v$version)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.key }}
    needs: [prepare, quality]
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-latest, the same label as SwitchHostsLite. Intel is cross-compiled
          # because Intel runners are retired.
          - key: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
          - key: macos-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
          - key: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          # Cross-compiled on x64: gpui's shaders are compiled by the host's fxc.
          - key: windows-aarch64
            os: windows-latest
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      NAME: SnapIt-${{ needs.prepare.outputs.version }}-${{ matrix.key }}
      # The updater checks the releases of the repository it was built from.
      SNAPIT_UPDATE_REPO: ${{ github.repository }}
      MACOSX_DEPLOYMENT_TARGET: "13.0"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          submodules: recursive

      # Install the pin in rust-toolchain.toml (currently 1.99.1). Never `stable`.
      - name: Toolchain
        run: |
          channel="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml | head -n 1)"
          echo "rust-toolchain.toml channel=$channel"
          rustup toolchain install "$channel"
          rustup target add ${{ matrix.target }}
          rustc --version

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        if: runner.os != 'macOS'
        run: cargo build --release --locked --target ${{ matrix.target }} -p snapit

      # ---- macOS ---------------------------------------------------------
      - name: Bundle app
        if: runner.os == 'macOS'
        run: scripts/bundle-macos.sh --target ${{ matrix.target }} --out dist

      # Same secret names as SwitchHostsLite. Empty on forks / unset repos → ad-hoc DMG.
      # SwitchHostsLite keeps this block commented in YAML; SnapIt runs it from
      # package-macos.sh so missing secrets skip signing instead of failing.
      - name: Package macOS
        if: runner.os == 'macOS'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: scripts/package-macos.sh --app dist/SnapIt.app --out out --name "$NAME"

      # ---- Windows -------------------------------------------------------
      # The windows-latest image no longer ships NSIS; Chocolatey's makensis is
      # installed before the bundler looks for it.
      - name: Install NSIS
        if: runner.os == 'Windows'
        run: choco install nsis -y --no-progress

      # Optional: Authenticode signing so SmartScreen warns less. Needs
      # WINDOWS_CERTIFICATE (base64 .pfx) and WINDOWS_CERTIFICATE_PASSWORD.
      # - name: Sign exe
      #   if: runner.os == 'Windows'
      #   shell: pwsh
      #   env:
      #     WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      #     WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      #   run: |
      #     $pfx = "$env:RUNNER_TEMP\cert.pfx"
      #     [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
      #     $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1
      #     & $signtool.FullName sign /f $pfx /p $env:WINDOWS_CERTIFICATE_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 "target\${{ matrix.target }}\release\snapit.exe"

      # Stages dist/windows/SnapIt/SnapIt.exe and writes
      # out/SnapIt-<version>-windows-<arch>-setup.exe.
      - name: Package Windows
        if: runner.os == 'Windows'
        run: |
          scripts/bundle-windows.sh \
            --bin "target/${{ matrix.target }}/release/snapit.exe" \
            --target "${{ matrix.target }}" \
            --out dist/windows --setup-out out

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.key }}
          # Do not upload the unpacked SnapIt.app directory as a release asset.
          path: |
            out/*.zip
            out/*.dmg
            out/*.exe
          if-no-files-found: error

  release:
    name: Publish release
    needs: [prepare, quality, build]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          submodules: recursive

      # Keep build artifacts out of the checked-out `assets/` directory: that
      # directory holds the app icons, and `files: assets/*` would publish them
      # as release downloads. `dist/` exists only in this job.
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Release notes
        run: |
          gh api "repos/${{ github.repository }}/releases/generate-notes" -f tag_name="$TAG" --jq .body > notes.md
          cat notes.md

      - name: latest.json and SHA256SUMS.txt
        run: |
          python3 scripts/release-manifest.py --dir dist --version "$VERSION" --tag "$TAG" \
            --repo "${{ github.repository }}" --notes-file notes.md
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          version = os.environ["VERSION"]
          expected = {
              "macos-aarch64": "macos-aarch64.zip",
              "macos-aarch64-dmg": "macos-aarch64.dmg",
              "macos-x86_64": "macos-x86_64.zip",
              "macos-x86_64-dmg": "macos-x86_64.dmg",
              "windows-x86_64": "windows-x86_64-setup.exe",
              "windows-aarch64": "windows-aarch64-setup.exe",
          }
          assets = json.loads(pathlib.Path("dist/latest.json").read_text())["assets"]
          if set(assets) != set(expected):
              raise SystemExit(f"incomplete release asset keys: {sorted(assets)}")
          for key, suffix in expected.items():
              name = f"SnapIt-{version}-{suffix}"
              path = pathlib.Path("dist") / name
              asset = assets[key]
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f"missing or empty release asset: {name}")
              if not asset["url"].endswith("/" + name) or asset["size"] != path.stat().st_size:
                  raise SystemExit(f"bad manifest entry for {name}")
              with path.open("rb") as f:
                  checksum = hashlib.file_digest(f, "sha256").hexdigest()
              if asset["sha256"] != checksum:
                  raise SystemExit(f"bad checksum for {name}")
          PY
          cat dist/latest.json dist/SHA256SUMS.txt
          ls -l dist

      # Pre-releases are marked so GitHub does not call them "latest", but the
      # updater lists releases itself and includes them, so a beta build can
      # move on to the next beta. The manifest names the macOS disk image
      # `macos-<arch>-dmg`, which the updater prefers over the zip.
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          name: SnapIt ${{ env.VERSION }}
          body_path: notes.md
          prerelease: ${{ contains(env.TAG, '-') }}
          files: dist/*
          fail_on_unmatched_files: true
