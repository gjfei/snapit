name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # Installs the toolchain pinned in rust-toolchain.toml (1.99.1).
      - name: Toolchain
        shell: bash
        run: |
          rustup toolchain install
          rustup component add clippy
          rustc --version

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --locked --workspace

      # vendor/xcap is excluded from the root workspace and intentionally ignores
      # its library Cargo.lock, so resolve it independently in this clean checkout.
      - name: Test xcap
        run: cargo test --manifest-path vendor/xcap/Cargo.toml --lib

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
