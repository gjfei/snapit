[workspace]
resolver = "2"
members = [
    "crates/capture",
    "crates/recorder",
    "crates/ocr",
    "crates/store",
    "crates/app",
]
default-members = ["crates/app"]
# Vendored fork, edited for SnapIt's recording needs; kept out of the workspace.
exclude = ["vendor/xcap"]

[workspace.package]
version = "0.0.3-beta.3"
edition = "2024"
license = "Apache-2.0"
publish = false
repository = "https://github.com/gjfei/snapit"

[workspace.dependencies]
snapit-capture = { path = "crates/capture" }
snapit-recorder = { path = "crates/recorder" }
snapit-ocr = { path = "crates/ocr" }
snapit-store = { path = "crates/store" }

# gpui-kit pins the exact GPUI snapshot it was released against; keep this exact.
gpui-kit = "=0.9.1"

anyhow = "1"
futures = "0.3"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
log = "0.4"
xcap = { path = "vendor/xcap" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# The same major as `image`'s PNG codec, so the HDR writer shares its version.
png = "0.18"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
rust-i18n = "4.2"
sys-locale = "0.3"

# UI paint code is too slow for interactive debugging at -O0.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
